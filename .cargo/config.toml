[build]
target = "x86_64-pc-windows-msvc"

[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "target-cpu=x86-64-v2",
    "-C", "link-arg=/OPT:REF",
    "-C", "link-arg=/OPT:ICF",
]

[alias]
xtask = "run --package xtask --"
t = "test --workspace"
b-rel = "build --release --workspace"

